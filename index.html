<script>
  (function () {
    "use strict";

    function initIcons() {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    const themeToggle = document.getElementById("themeToggle");
    const root = document.documentElement;

    function getPreferredTheme() {
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") return stored;
      } catch (error) {
        // Ignore storage issues in private browsing / blocked browsers
      }

      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      try {
        localStorage.setItem("theme", theme);
      } catch (error) {
        // Ignore if localStorage is unavailable
      }
    }

    setTheme(getPreferredTheme());

    if (themeToggle) {
      themeToggle.addEventListener("click", function () {
        const current = root.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        setTheme(next);
      });
    }

    const navbar = document.getElementById("navbar");
    const navLinks = document.querySelectorAll(".nav-links a");
    const sections = document.querySelectorAll("section[id]");

    function onScroll() {
      if (navbar) {
        if (window.scrollY > 30) {
          navbar.classList.add("scrolled");
        } else {
          navbar.classList.remove("scrolled");
        }
      }

      const backBtn = document.getElementById("backToTop");
      if (backBtn) {
        if (window.scrollY > 500) {
          backBtn.classList.add("visible");
        } else {
          backBtn.classList.remove("visible");
        }
      }

      let currentSection = "";
      sections.forEach(function (section) {
        const sectionTop = section.offsetTop - 120;
        if (window.scrollY >= sectionTop) {
          currentSection = section.getAttribute("id");
        }
      });

      navLinks.forEach(function (link) {
        link.classList.remove("active");
        if (link.getAttribute("href") === "#" + currentSection) {
          link.classList.add("active");
        }
      });
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");
    const mobileLinks = document.querySelectorAll(".mobile-link");

    function closeMenu() {
      if (!mobileMenu || !menuToggle) return;

      mobileMenu.classList.remove("open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Mở menu");
      document.body.style.overflow = "";
      menuToggle.innerHTML = '<i data-lucide="menu" width="20" height="20"></i>';
      initIcons();
      menuToggle.focus();
    }

    function openMenu() {
      if (!mobileMenu || !menuToggle) return;

      mobileMenu.classList.add("open");
      menuToggle.setAttribute("aria-expanded", "true");
      menuToggle.setAttribute("aria-label", "Đóng menu");
      document.body.style.overflow = "hidden";
      menuToggle.innerHTML = '<i data-lucide="x" width="20" height="20"></i>';
      initIcons();
    }

    if (menuToggle) {
      menuToggle.addEventListener("click", function () {
        if (mobileMenu && mobileMenu.classList.contains("open")) {
          closeMenu();
        } else {
          openMenu();
        }
      });
    }

    mobileLinks.forEach(function (link) {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && mobileMenu && mobileMenu.classList.contains("open")) {
        closeMenu();
      }
    });

    const revealElements = document.querySelectorAll(".reveal");

    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.12,
          rootMargin: "0px 0px -60px 0px",
        }
      );

      revealElements.forEach(function (el) {
        observer.observe(el);
      });
    } else {
      revealElements.forEach(function (el) {
        el.classList.add("visible");
      });
    }

    const backToTop = document.getElementById("backToTop");
    if (backToTop) {
      backToTop.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    const contactForm = document.getElementById("contactForm");
    const formMessage = document.getElementById("formMessage");

    if (contactForm && formMessage) {
      contactForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message").value.trim();

        formMessage.className = "form-message";
        formMessage.style.display = "block";
        formMessage.style.background = "";
        formMessage.style.color = "";
        formMessage.style.border = "";

        if (!name || !email || !message) {
          formMessage.textContent = "Vui lòng điền đầy đủ tất cả các trường.";
          formMessage.setAttribute("role", "alert");
          return;
        }

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
          formMessage.textContent = "Địa chỉ email không hợp lệ.";
          formMessage.setAttribute("role", "alert");
          return;
        }

        const subject = encodeURIComponent(`Liên hệ từ portfolio — ${name}`);
        const body = encodeURIComponent(
          `Tên: ${name}\nEmail: ${email}\n\nNội dung:\n${message}`
        );

        formMessage.classList.add("success");
        formMessage.setAttribute("role", "status");
        formMessage.textContent =
          "Đang mở ứng dụng email để bạn gửi tin nhắn. Vui lòng xác nhận gửi trong hộp thư.";

        window.location.href =
          `mailto:hello@alexnguyen.dev?subject=${subject}&body=${body}`;
      });
    }

    const yearEl = document.getElementById("year");
    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

    document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
      anchor.addEventListener("click", function (e) {
        const href = this.getAttribute("href");
        if (href === "#" || href === "") return;

        const target = document.querySelector(href);
        if (target) {
          e.preventDefault();
          const offsetTop =
            target.getBoundingClientRect().top + window.scrollY - 80;
          window.scrollTo({ top: offsetTop, behavior: "smooth" });
        }
      });
    });

    initIcons();
    window.addEventListener("load", initIcons);
  })();
</script>
